name: Reviewer R3 extension tests
on:
  push:
    branches: [main, 'revision/reviewer-r3-*', 'revision/round3-*']
    paths:
      - 'experiments/reviewer_r3/**'
      - '.github/workflows/reviewer-r3-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extension:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-14
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install scientific dependencies
        run: python -m pip install -r experiments/reviewer_r3/requirements.txt
      - name: Compile extension
        run: python -m compileall -q experiments/reviewer_r3
      - name: Regression and full fixture integration tests
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python experiments/reviewer_r3/test_actual_fpr.py
          python experiments/reviewer_r3/test_extension.py
          python experiments/reviewer_r3/test_snapshot_protocol.py
