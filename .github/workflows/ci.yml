name: Publication reproducibility checks

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned scientific environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-reproduction.txt
      - name: Check Python syntax
        run: |
          python -m compileall -q scripts experiments/paper xmag_pipeline.py tests
      - name: Validate frozen publication evidence
        run: python scripts/reproduce_paper.py verify
      - name: Run code and numerical regression tests
        run: python -m pytest -q
      - name: Run a synthetic pipeline smoke test
        run: python scripts/reproduce_paper.py smoke
