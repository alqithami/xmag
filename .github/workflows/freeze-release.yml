name: Freeze validated publication release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xmag-publication-release
  cancel-in-progress: false

jobs:
  freeze:
    # Trigger only from an explicitly designated final main-branch commit, or manual run.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[freeze-v1]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install verified runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-reproduction.txt
      - name: Validate evidence and source code
        run: |
          python scripts/reproduce_paper.py verify
          python -m pytest -q
          python scripts/reproduce_paper.py smoke
      - name: Create immutable-version tag and attach evidence
        shell: bash
        run: |
          set -euo pipefail
          tag=v1.0.0
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Release tag $tag already exists; refusing to overwrite the published version."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "X-MAG-COS accepted-paper code and verified evidence v1.0.0"
          git push origin "refs/tags/$tag"
          gh release create "$tag" artifacts/xmag_r3_complete_evidence.zip \
            --title 'X-MAG-COS publication reproducibility v1.0.0' \
            --notes-file docs/RELEASE_NOTES.md --verify-tag
